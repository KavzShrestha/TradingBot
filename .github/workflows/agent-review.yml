# Runs both reviewer subagents on every agent PR, then lets the implementer fix
# requested changes, up to MAX_FIX_ROUNDS rounds (to limit cost). After that, the PR
# waits for you.
# Docs: https://code.claude.com/docs/en/github-actions
name: agent-review

on:
  pull_request:
    types: [opened, synchronize, labeled]

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false   # a fix push queues a re-review instead of killing the current one

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Skipped until task M0-01 adds the Makefile
      - if: hashFiles('Makefile') != ''
        run: make setup
      - if: hashFiles('Makefile') != ''
        run: make lint
      - if: hashFiles('Makefile') != ''
        run: make test

  review:
    needs: checks
    env:
      MAX_FIX_ROUNDS: 3   # review <-> fix cycles before the PR waits for you
    # Only agent PRs. On "labeled" events, only react to the `agent` label itself,
    # so adding fix-round / ready-for-human labels doesn't start another review.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'agent') &&
      (github.event.action != 'labeled' || github.event.label.name == 'agent')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.AGENT_GH_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "paper-trading-agent"
          git config user.email "paper-trading-agent@users.noreply.github.com"

      # Each fix push re-triggers this workflow (`synchronize`), so reviewer and author
      # go back and forth automatically until approval or this many rounds.
      - name: Count previous fix rounds
        id: rounds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr view ${{ github.event.pull_request.number }} --json labels \
              --jq '[.labels[].name | select(startswith("fix-round-"))] | length')
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # agent-work.yml opens PRs as the claude[bot] GitHub App identity. Without
          # this, claude-code-action refuses to run on bot-authored PRs (an
          # anti-recursion safeguard) with "Workflow initiated by non-human actor".
          allowed_bots: "claude[bot]"
          prompt: |
            Review PR #${{ github.event.pull_request.number }} following CLAUDE.md.
            Get the diff with `gh pr diff ${{ github.event.pull_request.number }}`.

            IMPORTANT: this is a single, one-shot CI job — there is no way to resume or
            wait after you end your turn. Delegate using the `Task` tool ONLY — never
            the `Agent` tool. `Task` blocks and returns the subagent's full result to you
            in the same turn; `Agent` launches asynchronously in the background and
            abandons the work the instant you end your turn, since there is no next turn
            to resume it in.

            1. Run the `code-reviewer` subagent on the diff via `Task`.
            2. Also run the `quant-reviewer` subagent via `Task` if the PR branch starts
               with `strategy/`, or the diff touches docs/strategies/, reports/, or
               backend/app/strategies, engine, portfolio or backtest. Strategy specs
               count: they define the trading rules the code will implement.
            3. Post each review as a PR comment (`gh pr comment`), including its VERDICT line.
               Findings that are real but outside this PR's task must not block it: open
               one issue for them with
               `gh issue create --label needs-planning --label agent` so the planner
               schedules the follow-up work.
            4. If any verdict is REQUEST CHANGES and fewer than ${{ env.MAX_FIX_ROUNDS }}
               fix rounds have been done (done so far: ${{ steps.rounds.outputs.n }}):
               a. Add the label `fix-round-<done so far + 1>` and remove `needs-human`
                  if present.
               b. Delegate the fixes via `Task` to the subagent that owns the PR's branch
                  prefix (`backend/` -> backend-engineer, `frontend/` ->
                  frontend-engineer, `strategy/` -> strategy-researcher, `plan/` ->
                  planner). Pass it the full text of every REQUEST CHANGES review. It
                  must fix every blocker and major, fix minors when cheap, and may push
                  back on a finding only with a concrete reason.
               c. Push the fixes to the same branch (this starts the next review round),
                  then post one PR comment from the author listing each finding as
                  fixed / pushed back (with reason) / deferred to a `needs-planning`
                  issue (with link). Reviewers read this comment next round.
            5. If every verdict is APPROVE, add `ready-for-human` and remove
               `needs-human`. Otherwise, if all ${{ env.MAX_FIX_ROUNDS }} fix rounds are
               used up, add `needs-human` and comment a 3-line summary of what's still
               disputed.
            Never merge.
          claude_args: >-
            --max-turns 45
            --model sonnet
            --allowedTools "Read,Edit,Write,Glob,Grep,Task,Bash(git:*),Bash(gh:*),Bash(make:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(uv:*),Bash(pytest:*),Bash(ruff:*),Bash(mypy:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(ls:*),Bash(cat:*)"
