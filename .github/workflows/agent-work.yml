# Parallel "workers": one job per role (backend, frontend, strategy). Each job picks the
# next ready task issue for its role from the GitHub Issues board, implements it as that
# role, and opens a PR. Roles run at the same time; each role has at most one open PR.
# Docs: https://code.claude.com/docs/en/github-actions
name: agent-work

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  push:
    branches: [main]         # a merge may have unblocked dependent tasks
  workflow_dispatch: {}      # manual run from the Actions tab (also used by agent-plan)

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: backend
            agent: backend-engineer
          - role: frontend
            agent: frontend-engineer
          - role: strategy
            agent: strategy-researcher
    # One run per role at a time; different roles run in parallel.
    concurrency:
      group: agent-work-${{ matrix.role }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
      ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Personal access token so the PR this run opens triggers agent-review.yml
          # (events created with the default GITHUB_TOKEN don't start other workflows).
          token: ${{ secrets.AGENT_GH_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "paper-trading-agent"
          git config user.email "paper-trading-agent@users.noreply.github.com"

      # Cheap shell gate so we only start Claude when there is real work for this role:
      # no open PR for the role, and a `status:todo` task whose dependencies are closed.
      - name: Pick next ready task
        id: pick
        run: |
          open=$(gh pr list --label agent --label "role:$ROLE" --state open --json number --jq 'length')
          if [ "$open" -ge 1 ]; then
            echo "role:$ROLE already has an open agent PR; skipping."
            exit 0
          fi
          for n in $(gh issue list --state open --label task --label "role:$ROLE" --label status:todo \
                       --limit 100 --json number --jq '[.[].number] | sort | .[]'); do
            deps=$(gh issue view "$n" --json body --jq '.body' \
                     | grep -i '^depends on:' | grep -o '#[0-9]\+' | tr -d '#' || true)
            ready=true
            for d in $deps; do
              if [ "$(gh issue view "$d" --json state --jq '.state')" != "CLOSED" ]; then
                ready=false; break
              fi
            done
            if [ "$ready" = true ]; then
              echo "issue=$n" >> "$GITHUB_OUTPUT"
              gh issue edit "$n" --remove-label status:todo --add-label status:in-progress
              echo "Picked #$n"
              exit 0
            fi
          done
          echo "No ready task for role:$ROLE."

      - uses: anthropics/claude-code-action@v1
        if: steps.pick.outputs.issue != ''
        with:
          # Set ONE of these two secrets (see SETUP.md); the other can stay unset.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the `${{ matrix.agent }}` for this repo. Read CLAUDE.md, then read
            .claude/agents/${{ matrix.agent }}.md and follow it as your own instructions.
            Do the work yourself in this session; do not delegate to subagents.

            Your task is issue #${{ steps.pick.outputs.issue }}
            (`gh issue view ${{ steps.pick.outputs.issue }} --comments`). It is already
            labelled `status:in-progress`.

            1. Create branch `${{ matrix.role }}/<task-id>-<short-desc>` from main, where
               <task-id> is the ID at the start of the issue title (e.g. M1-03).
            2. Implement exactly that task, with tests. Run `make lint` and `make test`
               until both pass.
            3. If you discover extra work outside this task, do not do it. Open an issue
               with `gh issue create --label needs-planning --label agent` describing it.
            4. Push the branch and open the PR:
               `gh pr create --base main --label agent --label role:${{ matrix.role }}`
               with What / Why / How tested / Risks, and a line
               `Closes #${{ steps.pick.outputs.issue }}`.
            5. Label the issue: remove `status:in-progress`, add `status:in-review`.
            Never push to main, never merge.
          claude_args: >-
            --max-turns 60
            --model sonnet
            --allowedTools "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch,Bash(git:*),Bash(gh:*),Bash(make:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(uv:*),Bash(pytest:*),Bash(ruff:*),Bash(mypy:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(ls:*),Bash(mkdir:*),Bash(cat:*)"

      # Don't leave a task stuck as in-progress if the run died before opening a PR.
      - name: Release task on failure
        if: failure() && steps.pick.outputs.issue != ''
        run: |
          n=${{ steps.pick.outputs.issue }}
          gh issue edit "$n" --remove-label status:in-progress --add-label status:todo
          gh issue comment "$n" --body "agent-work run failed before finishing; task returned to \`status:todo\`. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
